		<title>Caravan</title>
<!--
Caravan's web page: the "Web" export preset's custom HTML shell. Godot fills in the
$GODOT_* placeholders on export.

The loading screen: endless country built from the game's own tiles (trails, copses,
ponds) pans slowly behind a card in the game's panel style, and the caravan drives
along a road on the card as the engine downloads. It stays up until the game has
drawn its first frame (main.gd calls window.caravanReady()), then fades out over it.

The art (sheets, pools, trail and pond pieces, road, caravan, font) is the ART block
below, written from the game's own sheets and registry by tools/art/loading_art.py;
rerun it after changing them. Keep the <head>
tag plain: tools/publish-web adds its noindex tag right after it.
-->
		<style>
:root {
	--ui: 1; /* the interface scale; set by the script like main.gd's ui_scale_for() */
	--grass: #67923e;
	--panel: #e99648; /* assets/UI/standard_panel_style.tres */
	--brown: #6f4115;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	background-color: var(--grass);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#loading {
	position: fixed;
	inset: 0;
	z-index: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	transition: opacity 0.6s ease;
}

#loading.done {
	opacity: 0;
	pointer-events: none;
}

#land, #shade {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
}

#shade {
	background: radial-gradient(ellipse at center, transparent 40%, rgba(20, 45, 10, 0.35));
}

#card {
	position: relative;
	box-sizing: border-box;
	max-width: calc(100vw - 32px);
	padding: calc(18px * var(--ui)) calc(28px * var(--ui)) calc(22px * var(--ui));
	background-color: var(--panel);
	border: calc(5px * var(--ui)) solid var(--brown);
	border-radius: calc(7px * var(--ui));
	box-shadow: 0 calc(6px * var(--ui)) 0 rgba(20, 45, 10, 0.4);
	color: var(--brown);
	font-family: 'Red Alert', monospace;
	text-align: center;
	visibility: hidden; /* until the font is in */
}

#title {
	margin: 0 0 calc(14px * var(--ui));
	font-size: calc(76.8px * var(--ui)); /* the font's grid is 12.8 px per em */
	font-weight: normal;
	line-height: 1;
}

#road {
	display: block;
	margin: 0 auto;
	border: calc(4px * var(--ui)) solid var(--brown);
	border-radius: calc(4px * var(--ui));
}

#status {
	margin-top: calc(12px * var(--ui));
	font-size: calc(25.6px * var(--ui));
	line-height: 1.25;
	white-space: pre-line;
}

#status.error {
	color: #8c1a0c;
}

		const add = (x, y, bit) => cells.set(key(x, y), (cells.get(key(x, y)) || 0) | bit);

		const to = level(s);

			const ctx = world.getContext('2d');
			for (let col = 0; col < world.width / T; col++) {
				for (let row = 0; row < rows; row++) {
					const [ground, object] = World.cell(col0 + col, row - (rows - 1) / 2);
					drawTile(ctx, ground, col * T, row * T);
					if (object) {
						drawTile(ctx, object, col * T, row * T);
					}
				}
			}
			ctx.setTransform(1, 0, 0, 1, 0, 0);
		}
		// The middle row is centred on screen, as the camera centres on the caravan.
		const ctx = land.getContext('2d');
		ctx.imageSmoothingEnabled = false;
		const x = Math.round((col0 * T - pan) * GAME_TEXEL);
		const y = Math.round(land.height / 2 - (world.height / 2) * GAME_TEXEL);
		ctx.drawImage(world, x, y, world.width * GAME_TEXEL, world.height * GAME_TEXEL);
	}

	function drawRoad() {
		const ctx = road.getContext('2d');
		ctx.imageSmoothingEnabled = false;
		const tile = T * roadTexel;
		for (let i = 0; i < roadTiles; i++) {
			ctx.drawImage(images.road, i * tile, 0, tile, tile);
		}
		const x = Math.round(shown * (roadTiles - 1) * T) * roadTexel;
		ctx.drawImage(images.caravan, frame * T, 0, T, T, x, 0, tile, tile);
	}

	function tick(time) {
		if (stopped) {
			return;
		}
		const dt = Math.min((time - (lastTime || time)) / 1000, 0.1);
		lastTime = time;
		shown += (target - shown) * Math.min(1, dt * 3);
		if (!reduceMotion) {
			frame = Math.floor((time / 1000) * TROT_FPS) % 2;
		}
		drawLand(time);
		drawRoad();
		requestAnimationFrame(tick);
	}

	resize();
	window.addEventListener('resize', resize);
	const font = new FontFace('Red Alert', `url(${ART.font})`);
	document.fonts.add(font);
	font.load().catch(() => {}).finally(() => {
		card.style.visibility = 'visible';
	});
	const names = Object.keys(ART.sheets);
	Promise.all([...names.map((n) => load(ART.sheets[n])), load(ART.road), load(ART.caravan)]).then((loaded) => {
		images = Object.fromEntries(names.map((n, i) => [n, loaded[i]]));
		images.road = loaded[names.length];
		images.caravan = loaded[names.length + 1];
		requestAnimationFrame(tick);
	});

	let fallback = 0;
	return {
		progress(current, total) {
			if (current > 0 && total > 0) {
				target = Math.min(current / total, 1);
				if (target < 1) {
					status.textContent = `Loading… ${Math.floor(target * 100)}%`;
				} else {
					status.textContent = 'Setting out…';
				}
			}
		},
		started() {
			target = 1;
			status.textContent = 'Setting out…';
			// The game says when it has drawn (window.caravanReady); don't wait forever.
			fallback = setTimeout(this.reveal, 8000);
		},
		reveal() {
			if (root.classList.contains('done')) {
				return;
			}
			clearTimeout(fallback);
			root.classList.add('done');
			setTimeout(() => {
				stopped = true;
				root.remove();
			}, 700);
		},
		fail(text) {
			status.textContent = text;
			status.classList.add('error');
			card.style.visibility = 'visible';
		},
	};
}());

window.caravanReady = Loading.reveal;

(function () {
	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			Loading.fail(err.message);
		} else if (typeof err === 'string') {
			Loading.fail(err);
		} else {
			Loading.fail('An unknown error occurred.');
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Your browser is missing what the game needs:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': Loading.progress,
		}).then(() => Loading.started(), displayFailureNotice);
	}
}());
		</script>
	</body>
